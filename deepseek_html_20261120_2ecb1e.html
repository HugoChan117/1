<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0b0d">
<title>Magnifier · 1–5× &amp; Filters</title>
<style>
  :root{
    --panel: rgba(18,20,24,.86);
    --stroke: rgba(255,255,255,.12);
    --text: #eef1f6;
    --dim:  #98a1af;
    --accent: #48c2ff;
  }
  *,*::before,*::after{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; }
  body{
    background:#000; color:var(--text); overflow:hidden;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overscroll-behavior:none;
  }

  /* ---------- viewport ---------- */
  #stage{ position:fixed; inset:0; background:#000; }
  #view{ display:block; width:100%; height:100%; touch-action:none; cursor:grab; }
  #view:active{ cursor:grabbing; }
  #src{ position:fixed; left:0; top:0; width:1px; height:1px; opacity:.01; pointer-events:none; }

  /* ---------- top HUD ---------- */
  .hud{
    position:fixed; top:0; left:0; right:0; z-index:5;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding: calc(env(safe-area-inset-top,0px) + 12px) 14px 22px;
    pointer-events:none;
    background:linear-gradient(to bottom, rgba(0,0,0,.6), transparent);
  }
  .hud > *{ pointer-events:auto; }
  .badge{
    font-variant-numeric: tabular-nums;
    font-weight:700; font-size:15px; letter-spacing:.02em;
    padding:8px 15px; border-radius:999px;
    background:var(--panel); border:1px solid var(--stroke);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  }
  .tools{ display:flex; gap:8px; }
  .btn{
    width:44px; height:44px; padding:0; display:grid; place-items:center;
    border-radius:14px; border:1px solid var(--stroke);
    background:var(--panel); color:var(--text); cursor:pointer;
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    transition: transform .12s ease, background .15s ease, color .15s ease;
  }
  .btn:active{ transform:scale(.92); }
  .btn.on{ background:var(--accent); color:#04121b; border-color:transparent; }
  .btn svg{ width:21px; height:21px; stroke:currentColor; stroke-width:1.9;
            fill:none; stroke-linecap:round; stroke-linejoin:round; }

  /* ---------- bottom panel ---------- */
  .panel{
    position:fixed; left:0; right:0; bottom:0; z-index:5;
    padding:14px 14px calc(env(safe-area-inset-bottom,0px) + 14px);
    background:var(--panel); border-top:1px solid var(--stroke);
    border-radius:22px 22px 0 0;
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
  }
  .zoomrow{ display:flex; align-items:center; gap:12px; }
  .step{
    flex:0 0 auto; width:46px; height:46px; border-radius:14px;
    border:1px solid var(--stroke); background:rgba(255,255,255,.06);
    color:var(--text); font-size:23px; font-weight:600; line-height:1;
    display:grid; place-items:center; cursor:pointer; user-select:none;
  }
  .step:active{ background:rgba(255,255,255,.18); }

  input[type=range]{
    -webkit-appearance:none; appearance:none;
    flex:1 1 auto; height:46px; background:transparent; cursor:pointer; margin:0;
  }
  input[type=range]::-webkit-slider-runnable-track{
    height:8px; border-radius:99px; background:rgba(255,255,255,.16);
  }
  input[type=range]::-moz-range-track{
    height:8px; border-radius:99px; background:rgba(255,255,255,.16);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:26px; height:26px; margin-top:-9px;
    border-radius:50%; background:#fff; border:3px solid var(--accent);
    box-shadow:0 2px 10px rgba(0,0,0,.6);
  }
  input[type=range]::-moz-range-thumb{
    width:20px; height:20px; border-radius:50%; background:#fff;
    border:3px solid var(--accent); box-shadow:0 2px 10px rgba(0,0,0,.6);
  }

  .filters{
    display:flex; gap:8px; margin-top:12px; padding:2px;
    overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch;
  }
  .filters::-webkit-scrollbar{ display:none; }
  .chip{
    flex:0 0 auto; padding:9px 16px; border-radius:999px;
    border:1px solid var(--stroke); background:rgba(255,255,255,.05);
    color:var(--dim); font-size:13.5px; font-weight:600; white-space:nowrap;
    cursor:pointer; transition: background .15s, color .15s, border-color .15s;
  }
  .chip.active{ background:#fff; color:#0b0d10; border-color:#fff; }

  /* ---------- misc ---------- */
  #hint{
    position:fixed; left:50%; top:50%; transform:translate(-50%,-50%);
    z-index:4; padding:10px 18px; border-radius:12px; max-width:82vw; text-align:center;
    background:rgba(0,0,0,.62); color:#cfd6e0; font-size:13px; line-height:1.45;
    pointer-events:none; transition:opacity .7s ease;
  }
  #hint.hide{ opacity:0; }

  #toast{
    position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom,0px) + 190px);
    transform:translate(-50%,10px); z-index:9;
    padding:10px 18px; border-radius:12px; font-size:13.5px; font-weight:600;
    background:rgba(255,255,255,.95); color:#0b0d10;
    opacity:0; pointer-events:none; transition:opacity .25s, transform .25s;
  }
  #toast.show{ opacity:1; transform:translate(-50%,0); }

  #error{
    position:fixed; inset:0; z-index:20; display:grid; place-items:center; padding:24px;
    background:rgba(0,0,0,.88); text-align:center;
  }
  #error[hidden]{ display:none; }
  #error .card{ max-width:380px; }
  #error h2{ font-size:19px; margin:0 0 10px; }
  #error p{ color:var(--dim); font-size:14px; line-height:1.55; margin:0 0 20px; }
  #retry{
    padding:12px 26px; border-radius:12px; border:0; cursor:pointer;
    background:var(--accent); color:#04121b; font-weight:700; font-size:14.5px;
  }
</style>
</head>
<body>

<div id="stage">
  <canvas id="view"></canvas>
</div>

<video id="src" playsinline muted autoplay></video>

<header class="hud">
  <div class="badge" id="zoomBadge">1.0×</div>
  <div class="tools">
    <button class="btn" id="torchBtn" title="Light" hidden>
      <svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.4 10.9c.6.4 1 1.1 1 1.8V16h4.8v-.3c0-.7.4-1.4 1-1.8A6 6 0 0 0 12 3Z"/></svg>
    </button>
    <button class="btn" id="pauseBtn" title="Freeze frame">
      <svg viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg>
    </button>
    <button class="btn" id="shotBtn" title="Save photo">
      <svg viewBox="0 0 24 24"><path d="M12 4v11m0 0 4-4m-4 4-4-4M5 19h14"/></svg>
    </button>
    <button class="btn" id="flipBtn" title="Switch camera">
      <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-13.7-5.3L4 8"/><path d="M4 4v4h4"/><path d="M4 13a8 8 0 0 0 13.7 5.3L20 16"/><path d="M20 20v-4h-4"/></svg>
    </button>
  </div>
</header>

<footer class="panel">
  <div class="zoomrow">
    <button class="step" id="zoomOut" aria-label="Zoom out">−</button>
    <input id="zoomSlider" type="range" min="1" max="5" step="0.1" value="1" aria-label="Zoom level">
    <button class="step" id="zoomIn" aria-label="Zoom in">+</button>
  </div>
  <div class="filters" id="filters"></div>
</footer>

<div id="hint">Pinch or drag the slider to zoom · Drag to pan · Double‑tap to snap 1×/3×</div>
<div id="toast"></div>

<div id="error" hidden>
  <div class="card">
    <h2>Camera unavailable</h2>
    <p id="errMsg"></p>
    <button id="retry">Try again</button>
  </div>
</div>

<script>
(() => {
  'use strict';

  const $ = (s) => document.querySelector(s);
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

  /* =========================================================
     Filter presets — CSS filter functions, drawn on the canvas
     ========================================================= */
  const FILTERS = [
    { id: 'none',     name: 'Normal',      css: 'none' },
    { id: 'gray',     name: 'Grayscale',   css: 'grayscale(1) contrast(1.08)' },
    { id: 'contrast', name: 'Hi-Contrast', css: 'grayscale(1) contrast(2.4) brightness(1.08)' },
    { id: 'invert',   name: 'Invert',      css: 'invert(1) grayscale(1) contrast(1.25)' },
    { id: 'yellow',   name: 'Yellow',      css: 'grayscale(1) sepia(1) saturate(6) hue-rotate(3deg) contrast(1.5) brightness(1.12)' },
    { id: 'warm',     name: 'Warm',        css: 'saturate(1.45) sepia(.22) contrast(1.06)' },
    { id: 'cool',     name: 'Cool',        css: 'saturate(1.3) hue-rotate(-14deg) brightness(1.06)' },
    { id: 'bright',   name: 'Bright',      css: 'brightness(1.6) contrast(1.15)' },
    { id: 'night',    name: 'Night',       css: 'brightness(2) contrast(1.35) saturate(.55)' },
  ];

  const canvas   = $('#view');
  const ctx      = canvas.getContext('2d', { alpha: false });
  const video    = $('#src');
  const badge    = $('#zoomBadge');
  const slider   = $('#zoomSlider');
  const torchBtn = $('#torchBtn');
  const pauseBtn = $('#pauseBtn');
  const shotBtn  = $('#shotBtn');
  const flipBtn  = $('#flipBtn');
  const hint     = $('#hint');
  const toastEl  = $('#toast');

  const ICON_PAUSE = '<svg viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg>';
  const ICON_PLAY  = '<svg viewBox="0 0 24 24"><path d="M8 5l11 7-11 7V5Z"/></svg>';

  /* Canvas 2D filter support (Safari < 16.4 has no ctx.filter) */
  const supportsCtxFilter =
    typeof CanvasRenderingContext2D !== 'undefined' &&
    'filter' in CanvasRenderingContext2D.prototype;

  /* =========================================================
     State
     ========================================================= */
  const state = {
    zoom: 1,          // 1 – 5
    cx: 0, cy: 0,     // crop centre, in source (video) pixels
    filter: 'none',
    paused: false,
    facing: 'environment',
    torch: false,
  };

  let stream = null;
  let rafId = 0;

  /* =========================================================
     Geometry helpers
     ========================================================= */

  /** Source rectangle that fills a W×H viewport at the current zoom. */
  function cropSize(W, H) {
    const vw = video.videoWidth || 1;
    const vh = video.videoHeight || 1;
    const ca = W / H;

    let sw = vw / state.zoom;
    let sh = vh / state.zoom;

    // "cover" fit: match the viewport aspect ratio
    if (sw / sh > ca) sw = sh * ca;
    else              sh = sw / ca;

    return { sw: Math.min(sw, vw), sh: Math.min(sh, vh) };
  }

  /** Draw the current (cropped, zoomed, filtered) frame into any 2D context. */
  function drawTo(c, W, H) {
    const vw = video.videoWidth, vh = video.videoHeight;
    if (!vw || !vh) return;

    if (!state.cx) { state.cx = vw / 2; state.cy = vh / 2; }

    const { sw, sh } = cropSize(W, H);

    // keep the crop window inside the frame
    const cx = clamp(state.cx, sw / 2, vw - sw / 2);
    const cy = clamp(state.cy, sh / 2, vh - sh / 2);
    state.cx = cx; state.cy = cy;

    const f = FILTERS.find(x => x.id === state.filter) || FILTERS[0];
    if (supportsCtxFilter) c.filter = f.css;

    c.drawImage(video, cx - sw / 2, cy - sh / 2, sw, sh, 0, 0, W, H);

    if (supportsCtxFilter) c.filter = 'none';
  }

  /* =========================================================
     Canvas sizing / render loop
     ========================================================= */
  function resize() {
    const r = canvas.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.max(1, Math.round(r.width * dpr));
    const h = Math.max(1, Math.round(r.height * dpr));
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
    }
  }

  function tick() {
    rafId = requestAnimationFrame(tick);
    if (state.paused) return;
    if (video.readyState < 2) return;
    drawTo(ctx, canvas.width, canvas.height);
  }

  /* =========================================================
     Camera
     ========================================================= */
  async function startCamera(facing) {
    stopStream();
    hideError();
    state.facing = facing;
    state.cx = 0; state.cy = 0;

    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        throw new Error('Your browser does not expose the Camera API. Serve the page over HTTPS (or localhost) and use a modern browser.');
      }

      stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: {
          facingMode: { ideal: facing },
          width:  { ideal: 1920 },
          height: { ideal: 1080 },
        },
      });

      video.srcObject = stream;
      await video.play().catch(() => {});

      // Torch availability
      const track = stream.getVideoTracks()[0];
      const caps = track && track.getCapabilities ? track.getCapabilities() : {};
      torchBtn.hidden = !caps.torch;
      state.torch = false;
      torchBtn.classList.remove('on');

    } catch (err) {
      showError(err);
    }
  }

  function stopStream() {
    if (stream) {
      stream.getTracks().forEach(t => t.stop());
      stream = null;
    }
    video.srcObject = null;
  }

  video.addEventListener('loadedmetadata', () => {
    state.cx = video.videoWidth / 2;
    state.cy = video.videoHeight / 2;
  });

  /* =========================================================
     Zoom
     ========================================================= */
  function setZoom(z) {
    const nz = clamp(Math.round(z * 10) / 10, 1, 5);
    if (nz === state.zoom) return;
    state.zoom = nz;
    updateZoomUI();
  }

  function updateZoomUI() {
    badge.textContent = state.zoom.toFixed(1) + '×';
    slider.value = String(state.zoom);
  }

  slider.addEventListener('input', () => setZoom(parseFloat(slider.value)));
  $('#zoomIn').addEventListener('click', () => setZoom(state.zoom + 0.5));
  $('#zoomOut').addEventListener('click', () => setZoom(state.zoom - 0.5));

  /* =========================================================
     Pointer interaction: drag-to-pan, pinch-to-zoom, double-tap
     ========================================================= */
  const pointers = new Map();
  let lastX = 0, lastY = 0;
  let pinchStartDist = 0, pinchStartZoom = 1;
  let downTime = 0, downX = 0, downY = 0, moved = false, lastTap = 0;

  function pointerDistance() {
    const [a, b] = [...pointers.values()];
    return Math.hypot(a.x - b.x, a.y - b.y);
  }

  function panBy(dx, dy) {
    const vw = video.videoWidth || 1;
    const vh = video.videoHeight || 1;
    const { sw, sh } = cropSize(canvas.width, canvas.height);
    // CSS px -> source px
    const kx = sw / Math.max(1, canvas.clientWidth);
    const ky = sh / Math.max(1, canvas.clientHeight);
    state.cx = clamp(state.cx - dx * kx, sw / 2, vw - sw / 2);
    state.cy = clamp(state.cy - dy * ky, sh / 2, vh - sh / 2);
  }

  canvas.addEventListener('pointerdown', (e) => {
    canvas.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (pointers.size === 1) {
      downTime = performance.now();
      downX = e.clientX; downY = e.clientY;
      lastX = e.clientX; lastY = e.clientY;
      moved = false;
    }
    if (pointers.size === 2) {
      pinchStartDist = pointerDistance();
      pinchStartZoom = state.zoom;
      moved = true; // a pinch is never a tap
    }
    fadeHint();
  });

  canvas.addEventListener('pointermove', (e) => {
    const p = pointers.get(e.pointerId);
    if (!p) return;
    p.x = e.clientX; p.y = e.clientY;

    if (pointers.size === 1) {
      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;
      lastX = e.clientX; lastY = e.clientY;
      if (Math.abs(e.clientX - downX) + Math.abs(e.clientY - downY) > 8) moved = true;
      panBy(dx, dy);
    } else if (pointers.size === 2 && pinchStartDist > 0) {
      setZoom(pinchStartZoom * (pointerDistance() / pinchStartDist));
    }
  });

  function endPointer(e) {
    if (!pointers.has(e.pointerId)) return;
    const wasSingle = pointers.size === 1;
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinchStartDist = 0;

    if (pointers.size === 0 && wasSingle && !moved && e.type === 'pointerup') {
      const now = performance.now();
      if (now - downTime < 260 && now - lastTap < 330) {
        setZoom(state.zoom > 1.05 ? 1 : 3);   // double-tap toggle
        lastTap = 0;
      } else {
        lastTap = now;
      }
    }
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);

  /* =========================================================
     Filters UI
     ========================================================= */
  function buildFilters() {
    const wrap = $('#filters');
    FILTERS.forEach(f => {
      const b = document.createElement('button');
      b.className = 'chip' + (f.id === state.filter ? ' active' : '');
      b.dataset.id = f.id;
      b.type = 'button';
      b.textContent = f.name;
      b.addEventListener('click', () => setFilter(f.id));
      wrap.appendChild(b);
    });
  }

  function setFilter(id) {
    state.filter = id;
    document.querySelectorAll('.chip').forEach(c =>
      c.classList.toggle('active', c.dataset.id === id));
    if (!supportsCtxFilter) {
      const f = FILTERS.find(x => x.id === id) || FILTERS[0];
      canvas.style.filter = f.css;
    }
  }

  /* =========================================================
     Torch / freeze / capture / flip
     ========================================================= */
  torchBtn.addEventListener('click', async () => {
    const track = stream && stream.getVideoTracks()[0];
    if (!track) return;
    try {
      state.torch = !state.torch;
      await track.applyConstraints({ advanced: [{ torch: state.torch }] });
      torchBtn.classList.toggle('on', state.torch);
    } catch {
      state.torch = false;
      torchBtn.classList.remove('on');
    }
  });

  function togglePause() {
    state.paused = !state.paused;
    pauseBtn.classList.toggle('on', state.paused);
    pauseBtn.innerHTML = state.paused ? ICON_PLAY : ICON_PAUSE;
    if (!state.paused) drawTo(ctx, canvas.width, canvas.height);
    toast(state.paused ? 'Frame frozen' : 'Live');
  }
  pauseBtn.addEventListener('click', togglePause);

  shotBtn.addEventListener('click', () => {
    if (!video.videoWidth) return;
    const c = document.createElement('canvas');
    c.width = canvas.width;
    c.height = canvas.height;
    drawTo(c.getContext('2d'), c.width, c.height);

    c.toBlob((blob) => {
      if (!blob) return;
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `magnifier-${Date.now()}.png`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
      toast('Photo saved');
    }, 'image/png');
  });

  flipBtn.addEventListener('click', () => {
    startCamera(state.facing === 'environment' ? 'user' : 'environment');
  });

  /* =========================================================
     Keyboard shortcuts
     ========================================================= */
  window.addEventListener('keydown', (e) => {
    switch (e.key) {
      case '+': case '=': setZoom(state.zoom + 0.5); break;
      case '-': case '_': setZoom(state.zoom - 0.5); break;
      case ' ': e.preventDefault(); togglePause(); break;
      case 'ArrowLeft':  panBy(70, 0); break;
      case 'ArrowRight': panBy(-70, 0); break;
      case 'ArrowUp':    panBy(0, 70); break;
      case 'ArrowDown':  panBy(0, -70); break;
      default: return;
    }
    fadeHint();
  });

  /* =========================================================
     Little helpers
     ========================================================= */
  let toastTimer = 0;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1600);
  }

  let hintTimer = setTimeout(() => hint.classList.add('hide'), 4500);
  function fadeHint() {
    clearTimeout(hintTimer);
    hint.classList.add('hide');
  }

  function showError(err) {
    const msg = (err && err.name === 'NotAllowedError')
      ? 'Camera access was blocked. Allow camera permission for this page in your browser settings, then reload.'
      : (err && err.name === 'NotFoundError')
        ? 'No camera was found on this device.'
        : (err && err.message) || 'The camera could not be started.';
    $('#errMsg').textContent = msg;
    $('#error').hidden = false;
  }
  function hideError() { $('#error').hidden = true; }

  $('#retry').addEventListener('click', () => startCamera(state.facing));

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && stream && video.paused) video.play().catch(() => {});
  });

  /* =========================================================
     Boot
     ========================================================= */
  buildFilters();
  updateZoomUI();
  setFilter('none');
  resize();

  new ResizeObserver(resize).observe(canvas);
  window.addEventListener('orientationchange', () => setTimeout(resize, 250));

  rafId = requestAnimationFrame(tick);
  startCamera('environment');
})();
</script>
</body>
</html>
