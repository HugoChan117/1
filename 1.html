<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0b0d10" />
<title>Magnifier 1–20×</title>
<style>
  :root{
    --panel: rgba(16,18,22,.74);
    --stroke: rgba(255,255,255,.13);
    --txt: #eef1f5;
    --accent: #ffd166;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; height:100%; background:#000; color:var(--txt);
    overflow:hidden; overscroll-behavior:none;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  #view{
    position:fixed; inset:0; width:100%; height:100%; display:block;
    background:#000; touch-action:none; cursor:crosshair;
  }
  #src{
    position:fixed; top:0; left:0; width:1px; height:1px;
    opacity:0; pointer-events:none;
  }

  /* ---------- top bar ---------- */
  .topbar{
    position:fixed; top:calc(10px + env(safe-area-inset-top));
    left:12px; right:12px; z-index:10;
    display:flex; align-items:center; gap:10px;
    pointer-events:none;
  }
  .badge{
    font-size:15px; font-weight:650; font-variant-numeric:tabular-nums;
    padding:6px 13px; border-radius:999px;
    background:var(--panel); border:1px solid var(--stroke);
    backdrop-filter:blur(12px) saturate(150%);
    -webkit-backdrop-filter:blur(12px) saturate(150%);
    box-shadow:0 6px 22px rgba(0,0,0,.35);
  }
  .hint{
    font-size:12.5px; color:#cfd6e0; line-height:1.25;
    padding:6px 12px; border-radius:999px;
    background:var(--panel); border:1px solid var(--stroke);
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    opacity:0; transform:translateY(-4px);
    transition:opacity .25s ease, transform .25s ease;
    max-width:70vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .hint.show{ opacity:1; transform:translateY(0); }

  /* ---------- controls ---------- */
  .controls{
    position:fixed; left:50%; transform:translateX(-50%);
    bottom:calc(14px + env(safe-area-inset-bottom));
    width:min(560px, calc(100% - 24px));
    z-index:10;
    padding:12px 16px 14px;
    border-radius:22px;
    background:var(--panel); border:1px solid var(--stroke);
    backdrop-filter:blur(16px) saturate(150%);
    -webkit-backdrop-filter:blur(16px) saturate(150%);
    box-shadow:0 10px 34px rgba(0,0,0,.45);
    display:flex; flex-direction:column; gap:10px;
  }
  .slider-wrap{ display:flex; align-items:center; gap:10px; }
  .lim{ font-size:11.5px; font-weight:600; color:#9aa4b2; letter-spacing:.02em; }

  input[type=range]{
    -webkit-appearance:none; appearance:none;
    flex:1; height:28px; background:transparent; margin:0; cursor:pointer;
  }
  input[type=range]::-webkit-slider-runnable-track{
    height:4px; border-radius:99px; background:rgba(255,255,255,.22);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:22px; height:22px; margin-top:-9px;
    border-radius:50%; background:#fff; border:0;
    box-shadow:0 2px 10px rgba(0,0,0,.55);
  }
  input[type=range]::-moz-range-track{
    height:4px; border-radius:99px; background:rgba(255,255,255,.22);
  }
  input[type=range]::-moz-range-thumb{
    width:22px; height:22px; border:0; border-radius:50%; background:#fff;
    box-shadow:0 2px 10px rgba(0,0,0,.55);
  }

  .buttons{ display:flex; justify-content:center; flex-wrap:wrap; gap:10px; }
  .btn{
    width:48px; height:48px; border-radius:50%;
    display:grid; place-items:center;
    color:var(--txt); background:rgba(255,255,255,.08);
    border:1px solid var(--stroke); cursor:pointer;
    transition:background .15s ease, transform .08s ease, color .15s ease;
  }
  .btn:hover{ background:rgba(255,255,255,.14); }
  .btn:active{ transform:scale(.93); }
  .btn svg{ width:22px; height:22px; }
  .btn.active{
    background:var(--accent); border-color:var(--accent); color:#161616;
  }
  .btn.rec-active{
    background:#ff4d4d; border-color:#ff4d4d; color:#fff;
    animation:pulse 1.4s infinite;
  }
  @keyframes pulse{
    0%,100%{ box-shadow:0 0 0 0 rgba(255,77,77,.65); }
    50%{ box-shadow:0 0 0 9px rgba(255,77,77,0); }
  }

  /* ---------- error ---------- */
  .error{
    position:fixed; inset:0; z-index:20; display:none;
    place-content:center; text-align:center; padding:28px;
    background:rgba(8,9,11,.94);
  }
  .error[data-show="1"]{ display:grid; }
  .error strong{ display:block; font-size:18px; margin-bottom:8px; }
  .error span{ display:block; font-size:13.5px; color:#a8b2c0; max-width:420px; margin:4px auto 0; }
  .error .retry{
    margin-top:18px; padding:10px 20px; border-radius:999px;
    border:1px solid var(--stroke); background:rgba(255,255,255,.1);
    color:var(--txt); font-size:14px; cursor:pointer;
  }

  @media (max-width:400px){
    .btn{ width:44px; height:44px; }
    .buttons{ gap:8px; }
  }
</style>
</head>
<body>

<canvas id="view"></canvas>
<video id="src" playsinline muted autoplay></video>

<div class="topbar">
  <div class="badge" id="badge">1.0×</div>
  <div class="hint" id="hint"></div>
</div>

<div class="controls">
  <div class="slider-wrap">
    <span class="lim">1×</span>
    <input id="zoom" type="range" min="0" max="1000" step="1" value="0" aria-label="Zoom" />
    <span class="lim">20×</span>
  </div>
  <div class="buttons">
    <button class="btn" id="flipBtn" style="display:none" title="Switch camera" aria-label="Switch camera">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.5 12a8.5 8.5 0 1 1-3.2-6.6"/>
        <path d="M21 3.5v5.5h-5.5"/>
      </svg>
    </button>
    <button class="btn" id="torchBtn" style="display:none" title="Flashlight" aria-label="Flashlight">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M13 2.5 5 13.5h5l-1 8 8.5-11.5h-5l1.5-7.5z"/>
      </svg>
    </button>
    <button class="btn" id="filterBtn" title="Cycle filter" aria-label="Cycle filter">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <path d="M4 7h8M16 7h4M4 17h2M10 17h10"/>
        <circle cx="14" cy="7" r="2.1"/>
        <circle cx="7" cy="17" r="2.1"/>
      </svg>
    </button>
    <button class="btn" id="recordBtn" title="Record video" aria-label="Record video">
      <svg viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="6.2" fill="currentColor"/>
      </svg>
    </button>
    <button class="btn" id="snapBtn" title="Capture photo" aria-label="Capture photo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="6.5" width="18" height="13.5" rx="2.6"/>
        <circle cx="12" cy="13.2" r="3.6"/>
        <path d="M8.6 6.5 10 3.6h4l1.4 2.9"/>
      </svg>
    </button>
    <button class="btn" id="fullBtn" title="Fullscreen" aria-label="Fullscreen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 9.5V5a1 1 0 0 1 1-1h4.5"/>
        <path d="M20 14.5V19a1 1 0 0 1-1 1h-4.5"/>
        <path d="M14.5 4H19a1 1 0 0 1 1 1v4.5"/>
        <path d="M9.5 20H5a1 1 0 0 1-1-1v-4.5"/>
      </svg>
    </button>
  </div>
</div>

<div class="error" id="error">
  <div>
    <strong id="errTitle">Camera unavailable</strong>
    <span id="errDetail"></span>
    <button class="retry" id="retryBtn">Try again</button>
  </div>
</div>

<script>
(() => {
  'use strict';

  // ---------- elements ----------
  const canvas   = document.getElementById('view');
  const ctx      = canvas.getContext('2d', { alpha: false });
  const video    = document.getElementById('src');
  const badge    = document.getElementById('badge');
  const hintEl   = document.getElementById('hint');
  const slider   = document.getElementById('zoom');
  const flipBtn  = document.getElementById('flipBtn');
  const torchBtn = document.getElementById('torchBtn');
  const filterBtn= document.getElementById('filterBtn');
  const recordBtn= document.getElementById('recordBtn');
  const snapBtn  = document.getElementById('snapBtn');
  const fullBtn  = document.getElementById('fullBtn');
  const errorEl  = document.getElementById('error');
  const errTitle = document.getElementById('errTitle');
  const errDetail= document.getElementById('errDetail');
  const retryBtn = document.getElementById('retryBtn');

  // ---------- constants ----------
  const MIN_Z = 1, MAX_Z = 20;
  const T_MAX = 1000;
  const LN_MAX = Math.log(MAX_Z);

  const FILTERS = [
    { name: 'No filter',      css: 'none' },
    { name: 'Invert',         css: 'invert(1)' },
    { name: 'Grayscale',      css: 'grayscale(1)' },
    { name: 'High contrast',  css: 'contrast(1.7) brightness(1.05)' },
    { name: 'Warm',           css: 'sepia(0.45) saturate(1.35) contrast(1.08)' },
    { name: 'Cool',           css: 'hue-rotate(180deg) saturate(1.2)' }
  ];

  // ---------- state ----------
  let stream    = null;
  let facing    = 'environment';
  let torchOn   = false;

  let zoom          = 1;   // requested total magnification (1..20)
  let nativeApplied = 1;   // actual device zoom currently active
  let canvasZoom    = 1;   // extra magnification applied by canvas
  let zoomCaps      = null;// { min, max, step } or null

  let center = { x: 0, y: 0 };
  let baseW  = 0, baseH = 0, cw = 0, ch = 0;

  let sliderBusy = false;
  let filterIndex = 0;

  let recorder = null, recChunks = [], recording = false;
  let nativePending = null, applyingNative = false;

  // ---------- helpers ----------
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

  function cropSize() {
    return { w: baseW / canvasZoom, h: baseH / canvasZoom };
  }

  function computeBase() {
    const vw = video.videoWidth, vh = video.videoHeight;
    if (!vw || !vh || !cw || !ch) { baseW = baseH = 0; return; }
    const aspect = cw / ch;
    if (vw / vh > aspect) {
      baseH = vh;
      baseW = vh * aspect;
    } else {
      baseW = vw;
      baseH = vw / aspect;
    }
  }

  function clampCenter() {
    const vw = video.videoWidth, vh = video.videoHeight;
    if (!vw || !vh || !baseW) return;
    const c = cropSize();
    center.x = clamp(center.x, c.w / 2, Math.max(c.w / 2, vw - c.w / 2));
    center.y = clamp(center.y, c.h / 2, Math.max(c.h / 2, vh - c.h / 2));
  }

  // log slider mapping: 0 → 1×, 500 → ≈4.47×, 1000 → 20×
  function zoomToSlider(z) { return Math.round(T_MAX * Math.log(z) / LN_MAX); }
  function sliderToZoom(v) { return Math.pow(MAX_Z, v / T_MAX); }

  function updateZoomUI() {
    badge.textContent = zoom.toFixed(1) + '×';
    if (!sliderBusy) {
      const v = String(zoomToSlider(zoom));
      if (slider.value !== v) slider.value = v;
    }
  }

  let toastTimer = 0;
  function toast(msg, ms = 2200) {
    hintEl.textContent = msg;
    hintEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => hintEl.classList.remove('show'), ms);
  }

  // ---------- native device zoom ----------
  function desiredNative(z) {
    if (!zoomCaps) return 1;
    const { min, max, step } = zoomCaps;
    const maxZ = Math.min(max, MAX_Z);
    if (z < min) return 1; // cannot go below hardware min
    let n = Math.min(z, maxZ);
    if (step && step > 0) {
      n = Math.floor((n + 1e-9) / step) * step; // never exceed requested
    }
    n = clamp(n, min, maxZ);
    return n;
  }

  function requestNative(n) {
    nativePending = n;
    if (!applyingNative) flushNative();
  }

  async function flushNative() {
    if (applyingNative) return;
    applyingNative = true;

    while (nativePending !== null) {
      const n = nativePending;
      nativePending = null;

      if (!zoomCaps || !stream) { nativePending = null; break; }
      const track = stream.getVideoTracks()[0];
      if (!track) { nativePending = null; break; }

      let ok = false;
      try {
        await track.applyConstraints({ advanced: [{ zoom: n }] });
        ok = true;
      } catch (_) {
        try {
          await track.applyConstraints({ zoom: n });
          ok = true;
        } catch (__) { ok = false; }
      }

      if (ok) {
        nativeApplied = n;
      } else {
        // device zoom unavailable — fall back to canvas only
        zoomCaps = null;
        nativeApplied = 1;
        toast('Device zoom unavailable — canvas zoom used');
      }

      canvasZoom = zoom / nativeApplied;
      clampCenter();
    }

    applyingNative = false;
  }

  // ---------- zoom application ----------
  function setZoom(z, focal) {
    z = clamp(z, MIN_Z, MAX_Z);
    if (!baseW) {
      zoom = z;
      canvasZoom = z / nativeApplied;
      updateZoomUI();
      return;
    }

    const rect = canvas.getBoundingClientRect();
    const u = focal ? clamp((focal.x - rect.left) / rect.width, 0, 1) : 0.5;
    const v = focal ? clamp((focal.y - rect.top) / rect.height, 0, 1) : 0.5;

    const old = cropSize();
    const px = center.x - old.w / 2 + u * old.w;
    const py = center.y - old.h / 2 + v * old.h;

    zoom = z;

    const n = desiredNative(z);
    if (n !== nativeApplied) requestNative(n);

    canvasZoom = zoom / nativeApplied;

    const nu = cropSize();
    center.x = px - u * nu.w + nu.w / 2;
    center.y = py - v * nu.h + nu.h / 2;

    clampCenter();
    updateZoomUI();
  }

  // ---------- canvas sizing ----------
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cw = window.innerWidth;
    ch = window.innerHeight;
    canvas.width  = Math.max(1, Math.round(cw * dpr));
    canvas.height = Math.max(1, Math.round(ch * dpr));
    canvas.style.width  = cw + 'px';
    canvas.style.height = ch + 'px';
    computeBase();
    clampCenter();
  }

  // ---------- render loop ----------
  function render() {
    requestAnimationFrame(render);
    const vw = video.videoWidth, vh = video.videoHeight;
    if (!vw || !vh || !baseW) return;

    const c = cropSize();
    const sx = clamp(center.x - c.w / 2, 0, Math.max(0, vw - c.w));
    const sy = clamp(center.y - c.h / 2, 0, Math.max(0, vh - c.h));

    ctx.filter = FILTERS[filterIndex].css;
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(video, sx, sy, c.w, c.h, 0, 0, canvas.width, canvas.height);
  }

  // ---------- pointer / gesture handling ----------
  const pts = new Map();
  let lastPinchDist = 0;
  let lastMid = null;

  canvas.addEventListener('pointerdown', (e) => {
    if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch (_) {} }
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (pts.size === 2) {
      const [a, b] = [...pts.values()];
      lastPinchDist = Math.hypot(a.x - b.x, a.y - b.y);
      lastMid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    }
    hintEl.classList.remove('show');
  });

  canvas.addEventListener('pointermove', (e) => {
    const p = pts.get(e.pointerId);
    if (!p) return;
    const prevX = p.x, prevY = p.y;
    p.x = e.clientX;
    p.y = e.clientY;

    if (pts.size === 1) {
      const c = cropSize();
      if (c.w > 0) {
        center.x -= (p.x - prevX) * c.w / cw;
        center.y -= (p.y - prevY) * c.h / ch;
        clampCenter();
      }
    } else if (pts.size >= 2) {
      const [a, b] = [...pts.values()];
      const dist = Math.hypot(a.x - b.x, a.y - b.y);
      const mid  = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };

      if (lastPinchDist > 0 && lastMid) {
        const c = cropSize();
        if (c.w > 0) {
          center.x -= (mid.x - lastMid.x) * c.w / cw;
          center.y -= (mid.y - lastMid.y) * c.h / ch;
          clampCenter();
        }
        setZoom(zoom * (dist / lastPinchDist), mid);
      }
      lastPinchDist = dist;
      lastMid = mid;
    }
  });

  function endPointer(e) {
    pts.delete(e.pointerId);
    if (pts.size < 2) { lastPinchDist = 0; lastMid = null; }
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);
  canvas.addEventListener('pointerleave', endPointer);

  // mouse wheel zoom (desktop)
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const factor = Math.exp(-e.deltaY * 0.0016);
    setZoom(zoom * factor, { x: e.clientX, y: e.clientY });
  }, { passive: false });

  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  // ---------- slider ----------
  slider.addEventListener('pointerdown', () => { sliderBusy = true; });
  window.addEventListener('pointerup',   () => { sliderBusy = false; });
  window.addEventListener('pointercancel', () => { sliderBusy = false; });

  slider.addEventListener('input', () => {
    setZoom(sliderToZoom(parseFloat(slider.value)), null);
  });

  // ---------- camera ----------
  function showError(title, detail) {
    errTitle.textContent = title;
    errDetail.textContent = detail || '';
    errorEl.dataset.show = '1';
  }
  function hideError() { delete errorEl.dataset.show; }

  function stopCamera() {
    if (stream) {
      stream.getTracks().forEach(t => { try { t.stop(); } catch (_) {} });
      stream = null;
    }
  }

  async function updateFlipVisibility() {
    try {
      const devs = await navigator.mediaDevices.enumerateDevices();
      const cams = devs.filter(d => d.kind === 'videoinput');
      flipBtn.style.display = cams.length > 1 ? 'grid' : 'none';
    } catch (_) {
      flipBtn.style.display = 'none';
    }
  }

  async function startCamera(face) {
    hideError();

    if (!window.isSecureContext) {
      showError('HTTPS required', 'Camera access only works on https:// pages or on localhost.');
      return;
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showError('Camera not supported', 'This browser does not expose getUserMedia.');
      return;
    }

    stopCamera();

    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: {
          facingMode: { ideal: face },
          width:  { ideal: 1920 },
          height: { ideal: 1080 }
        }
      });
    } catch (err) {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
      } catch (err2) {
        showError('Camera unavailable', (err2 && err2.message) || String(err2));
        return;
      }
    }

    video.srcObject = stream;
    try { await video.play(); } catch (_) {}

    // reset native zoom state for the new camera
    nativeApplied = 1;
    canvasZoom = zoom;
    zoomCaps = null;
    nativePending = null;

    const track = stream.getVideoTracks()[0];
    const caps  = (track && track.getCapabilities) ? track.getCapabilities() : {};

    if (caps.zoom && caps.zoom.max > caps.zoom.min) {
      zoomCaps = { min: caps.zoom.min, max: caps.zoom.max, step: caps.zoom.step || 0.1 };
    }

    torchOn = false;
    torchBtn.classList.remove('active');
    torchBtn.style.display = caps.torch ? 'grid' : 'none';

    updateFlipVisibility();
    updateZoomUI();

    // if the user is already zoomed in, try to use native zoom right away
    const n = desiredNative(zoom);
    if (n > 1) requestNative(n);
  }

  // ---------- filters ----------
  filterBtn.addEventListener('click', () => {
    filterIndex = (filterIndex + 1) % FILTERS.length;
    filterBtn.classList.toggle('active', filterIndex !== 0);
    toast(FILTERS[filterIndex].name);
  });

  // ---------- recording ----------
  function pickMime() {
    const list = [
      'video/webm;codecs=vp9',
      'video/webm;codecs=vp8',
      'video/webm',
      'video/mp4'
    ];
    for (const m of list) {
      try {
        if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m;
      } catch (_) {}
    }
    return '';
  }

  function stamp() {
    return new Date().toISOString().replace(/[:.]/g, '-');
  }

  function toggleRecording() {
    recording ? stopRecording() : startRecording();
  }

  function startRecording() {
    if (recording) return;
    if (!window.MediaRecorder) { toast('Recording not supported'); return; }

    try {
      const cstream = canvas.captureStream(30);
      const mime = pickMime();
      const opts = { videoBitsPerSecond: 8_000_000 };
      if (mime) opts.mimeType = mime;

      recorder = new MediaRecorder(cstream, opts);
      recChunks = [];

      recorder.ondataavailable = (e) => {
        if (e.data && e.data.size) recChunks.push(e.data);
      };

      recorder.onstop = () => {
        const type = (recorder && recorder.mimeType) || mime || 'video/webm';
        const blob = new Blob(recChunks, { type });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'magnifier-' + stamp() + '.webm';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 2000);

        recording = false;
        recordBtn.classList.remove('rec-active');
        toast('Recording saved');
      };

      recorder.start(250);
      recording = true;
      recordBtn.classList.add('rec-active');
      toast('Recording started');
    } catch (err) {
      toast('Recording failed');
    }
  }

  function stopRecording() {
    if (recorder && recorder.state !== 'inactive') {
      try { recorder.stop(); }
      catch (_) {
        recording = false;
        recordBtn.classList.remove('rec-active');
      }
    }
  }

  // ---------- buttons ----------
  flipBtn.addEventListener('click', () => {
    facing = (facing === 'environment') ? 'user' : 'environment';
    startCamera(facing);
    toast(facing === 'user' ? 'Front camera' : 'Rear camera');
  });

  torchBtn.addEventListener('click', async () => {
    const track = stream && stream.getVideoTracks()[0];
    if (!track) return;
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    if (!caps.torch) { toast('No flashlight on this camera'); return; }

    torchOn = !torchOn;
    try {
      await track.applyConstraints({ advanced: [{ torch: torchOn }] });
      torchBtn.classList.toggle('active', torchOn);
    } catch (err) {
      torchOn = false;
      torchBtn.classList.remove('active');
      toast('Flashlight not available');
    }
  });

  recordBtn.addEventListener('click', toggleRecording);

  snapBtn.addEventListener('click', () => {
    canvas.toBlob((blob) => {
      if (!blob) return;
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'magnifier-' + stamp() + '.png';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1500);
      toast('Saved capture');
    }, 'image/png');
  });

  fullBtn.addEventListener('click', async () => {
    try {
      if (!document.fullscreenElement) {
        await (document.documentElement.requestFullscreen ||
               document.documentElement.webkitRequestFullscreen).call(document.documentElement);
      } else {
        await document.exitFullscreen();
      }
    } catch (_) { toast('Fullscreen blocked'); }
  });

  retryBtn.addEventListener('click', () => startCamera(facing));

  // ---------- boot ----------
  video.addEventListener('loadedmetadata', () => {
    center.x = video.videoWidth / 2;
    center.y = video.videoHeight / 2;
    computeBase();
    clampCenter();

    // try to restore native zoom for the current magnification
    const n = desiredNative(zoom);
    if (n > 1) requestNative(n);

    updateZoomUI();
  });

  if (navigator.mediaDevices && navigator.mediaDevices.addEventListener) {
    navigator.mediaDevices.addEventListener('devicechange', updateFlipVisibility);
  }

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 250));
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) resize();
  });
  window.addEventListener('pagehide', () => {
    stopRecording();
    stopCamera();
  });

  resize();
  updateZoomUI();
  requestAnimationFrame(render);
  startCamera(facing);

  setTimeout(() => {
    hintEl.textContent = 'Pinch or slide to zoom · drag to pan';
    hintEl.classList.add('show');
    setTimeout(() => hintEl.classList.remove('show'), 4500);
  }, 700);
})();
</script>
</body>
</html>
