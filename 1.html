<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0b0d10" />
<title>Magnifier 1–10×</title>
<style>
  :root{
    --panel: rgba(16,18,22,.74);
    --stroke: rgba(255,255,255,.13);
    --txt: #eef1f5;
    --accent: #ffd166;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; height:100%; background:#000; color:var(--txt);
    overflow:hidden; overscroll-behavior:none;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  #view{
    position:fixed; inset:0; width:100%; height:100%; display:block;
    background:#000; touch-action:none; cursor:crosshair;
  }
  #src{
    position:fixed; top:0; left:0; width:1px; height:1px;
    opacity:0; pointer-events:none;
  }

  /* ---------- top bar ---------- */
  .topbar{
    position:fixed; top:calc(10px + env(safe-area-inset-top));
    left:12px; right:12px; z-index:10;
    display:flex; align-items:center; gap:10px;
    pointer-events:none;
  }
  .badge{
    font-size:15px; font-weight:650; font-variant-numeric:tabular-nums;
    padding:6px 13px; border-radius:999px;
    background:var(--panel); border:1px solid var(--stroke);
    backdrop-filter:blur(12px) saturate(150%);
    -webkit-backdrop-filter:blur(12px) saturate(150%);
    box-shadow:0 6px 22px rgba(0,0,0,.35);
  }
  .hint{
    font-size:12.5px; color:#cfd6e0; line-height:1.25;
    padding:6px 12px; border-radius:999px;
    background:var(--panel); border:1px solid var(--stroke);
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    opacity:0; transform:translateY(-4px);
    transition:opacity .25s ease, transform .25s ease;
    max-width:70vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .hint.show{ opacity:1; transform:translateY(0); }

  /* ---------- controls ---------- */
  .controls{
    position:fixed; left:50%; transform:translateX(-50%);
    bottom:calc(14px + env(safe-area-inset-bottom));
    width:min(560px, calc(100% - 24px));
    z-index:10;
    padding:12px 16px 14px;
    border-radius:22px;
    background:var(--panel); border:1px solid var(--stroke);
    backdrop-filter:blur(16px) saturate(150%);
    -webkit-backdrop-filter:blur(16px) saturate(150%);
    box-shadow:0 10px 34px rgba(0,0,0,.45);
    display:flex; flex-direction:column; gap:10px;
  }
  .slider-wrap{ display:flex; align-items:center; gap:10px; }
  .lim{ font-size:11.5px; font-weight:600; color:#9aa4b2; letter-spacing:.02em; }

  input[type=range]{
    -webkit-appearance:none; appearance:none;
    flex:1; height:28px; background:transparent; margin:0; cursor:pointer;
  }
  input[type=range]::-webkit-slider-runnable-track{
    height:4px; border-radius:99px; background:rgba(255,255,255,.22);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:22px; height:22px; margin-top:-9px;
    border-radius:50%; background:#fff; border:0;
    box-shadow:0 2px 10px rgba(0,0,0,.55);
  }
  input[type=range]::-moz-range-track{
    height:4px; border-radius:99px; background:rgba(255,255,255,.22);
  }
  input[type=range]::-moz-range-thumb{
    width:22px; height:22px; border:0; border-radius:50%; background:#fff;
    box-shadow:0 2px 10px rgba(0,0,0,.55);
  }

  .buttons{ display:flex; justify-content:center; gap:14px; }
  .btn{
    width:50px; height:50px; border-radius:50%;
    display:grid; place-items:center;
    color:var(--txt); background:rgba(255,255,255,.08);
    border:1px solid var(--stroke); cursor:pointer;
    transition:background .15s ease, transform .08s ease, color .15s ease;
  }
  .btn:hover{ background:rgba(255,255,255,.14); }
  .btn:active{ transform:scale(.93); }
  .btn svg{ width:22px; height:22px; }
  .btn.active{
    background:var(--accent); border-color:var(--accent); color:#161616;
  }

  /* ---------- error ---------- */
  .error{
    position:fixed; inset:0; z-index:20; display:none;
    place-content:center; text-align:center; padding:28px;
    background:rgba(8,9,11,.94);
  }
  .error[data-show="1"]{ display:grid; }
  .error strong{ display:block; font-size:18px; margin-bottom:8px; }
  .error span{ display:block; font-size:13.5px; color:#a8b2c0; max-width:420px; margin:4px auto 0; }
  .error .retry{
    margin-top:18px; padding:10px 20px; border-radius:999px;
    border:1px solid var(--stroke); background:rgba(255,255,255,.1);
    color:var(--txt); font-size:14px; cursor:pointer;
  }

  @media (max-width:380px){
    .btn{ width:46px; height:46px; }
    .buttons{ gap:10px; }
  }
</style>
</head>
<body>

<canvas id="view"></canvas>
<video id="src" playsinline muted autoplay></video>

<div class="topbar">
  <div class="badge" id="badge">1.0×</div>
  <div class="hint" id="hint"></div>
</div>

<div class="controls">
  <div class="slider-wrap">
    <span class="lim">1×</span>
    <input id="zoom" type="range" min="1" max="10" step="0.1" value="1" aria-label="Zoom" />
    <span class="lim">10×</span>
  </div>
  <div class="buttons">
    <button class="btn" id="flipBtn" title="Switch camera" aria-label="Switch camera">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.5 12a8.5 8.5 0 1 1-3.2-6.6"/>
        <path d="M21 3.5v5.5h-5.5"/>
      </svg>
    </button>
    <button class="btn" id="torchBtn" title="Flashlight" aria-label="Flashlight">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M13 2.5 5 13.5h5l-1 8 8.5-11.5h-5l1.5-7.5z"/>
      </svg>
    </button>
    <button class="btn" id="snapBtn" title="Capture photo" aria-label="Capture photo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="6.5" width="18" height="13.5" rx="2.6"/>
        <circle cx="12" cy="13.2" r="3.6"/>
        <path d="M8.6 6.5 10 3.6h4l1.4 2.9"/>
      </svg>
    </button>
    <button class="btn" id="fullBtn" title="Fullscreen" aria-label="Fullscreen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 9.5V5a1 1 0 0 1 1-1h4.5"/>
        <path d="M20 14.5V19a1 1 0 0 1-1 1h-4.5"/>
        <path d="M14.5 4H19a1 1 0 0 1 1 1v4.5"/>
        <path d="M9.5 20H5a1 1 0 0 1-1-1v-4.5"/>
      </svg>
    </button>
  </div>
</div>

<div class="error" id="error">
  <div>
    <strong id="errTitle">Camera unavailable</strong>
    <span id="errDetail"></span>
    <button class="retry" id="retryBtn">Try again</button>
  </div>
</div>

<script>
(() => {
  'use strict';

  // ---------- elements ----------
  const canvas   = document.getElementById('view');
  const ctx      = canvas.getContext('2d', { alpha: false });
  const video    = document.getElementById('src');
  const badge    = document.getElementById('badge');
  const hintEl   = document.getElementById('hint');
  const slider   = document.getElementById('zoom');
  const flipBtn  = document.getElementById('flipBtn');
  const torchBtn = document.getElementById('torchBtn');
  const snapBtn  = document.getElementById('snapBtn');
  const fullBtn  = document.getElementById('fullBtn');
  const errorEl  = document.getElementById('error');
  const errTitle = document.getElementById('errTitle');
  const errDetail= document.getElementById('errDetail');
  const retryBtn = document.getElementById('retryBtn');

  // ---------- state ----------
  const MIN_Z = 1, MAX_Z = 10;
  let stream   = null;
  let facing   = 'environment';
  let torchOn  = false;
  let zoom     = 1;
  let center   = { x: 0, y: 0 };   // centre of the visible crop, in video pixels
  let baseW    = 0, baseH = 0;     // crop size at zoom = 1 (cover fit)
  let cw       = 0, ch = 0;        // canvas size in CSS px

  // ---------- helpers ----------
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

  function cropSize(z) {
    return { w: baseW / z, h: baseH / z };
  }

  function computeBase() {
    const vw = video.videoWidth, vh = video.videoHeight;
    if (!vw || !vh || !cw || !ch) { baseW = baseH = 0; return; }
    const aspect = cw / ch;
    if (vw / vh > aspect) {          // video wider than screen → crop sides
      baseH = vh;
      baseW = vh * aspect;
    } else {                         // video taller → crop top/bottom
      baseW = vw;
      baseH = vw / aspect;
    }
  }

  function clampCenter() {
    const vw = video.videoWidth, vh = video.videoHeight;
    if (!vw || !vh || !baseW) return;
    const c = cropSize(zoom);
    center.x = clamp(center.x, c.w / 2, Math.max(c.w / 2, vw - c.w / 2));
    center.y = clamp(center.y, c.h / 2, Math.max(c.h / 2, vh - c.h / 2));
  }

  function updateZoomUI() {
    badge.textContent = zoom.toFixed(1) + '×';
    if (document.activeElement !== slider) slider.value = zoom.toFixed(1);
  }

  /** Change zoom, keeping the source point under `focal` (CSS px) fixed. */
  function setZoom(z, focal) {
    const nz = clamp(z, MIN_Z, MAX_Z);
    if (!baseW) { zoom = nz; updateZoomUI(); return; }

    const rect = canvas.getBoundingClientRect();
    const u = focal ? (focal.x - rect.left) / rect.width  : 0.5;
    const v = focal ? (focal.y - rect.top)  / rect.height : 0.5;

    const old = cropSize(zoom);
    const px = center.x - old.w / 2 + u * old.w;
    const py = center.y - old.h / 2 + v * old.h;

    zoom = nz;
    const nu = cropSize(zoom);
    center.x = px - u * nu.w + nu.w / 2;
    center.y = py - v * nu.h + nu.h / 2;

    clampCenter();
    updateZoomUI();
  }

  let toastTimer = 0;
  function toast(msg, ms = 2200) {
    hintEl.textContent = msg;
    hintEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => hintEl.classList.remove('show'), ms);
  }

  // ---------- canvas sizing ----------
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cw = window.innerWidth;
    ch = window.innerHeight;
    canvas.width  = Math.max(1, Math.round(cw * dpr));
    canvas.height = Math.max(1, Math.round(ch * dpr));
    canvas.style.width  = cw + 'px';
    canvas.style.height = ch + 'px';
    computeBase();
    clampCenter();
  }

  // ---------- render loop ----------
  function render() {
    requestAnimationFrame(render);
    const vw = video.videoWidth, vh = video.videoHeight;
    if (!vw || !vh || !baseW) return;

    const c = cropSize(zoom);
    const sx = clamp(center.x - c.w / 2, 0, Math.max(0, vw - c.w));
    const sy = clamp(center.y - c.h / 2, 0, Math.max(0, vh - c.h));

    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(video, sx, sy, c.w, c.h, 0, 0, canvas.width, canvas.height);
  }

  // ---------- pointer / gesture handling ----------
  const pts = new Map();
  let lastPinchDist = 0;
  let lastMid = null;
  let lastTap = 0;

  canvas.addEventListener('pointerdown', (e) => {
    if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch(_){} }
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (pts.size === 2) {
      const [a, b] = [...pts.values()];
      lastPinchDist = Math.hypot(a.x - b.x, a.y - b.y);
      lastMid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    }
    hintEl.classList.remove('show');
  });

  canvas.addEventListener('pointermove', (e) => {
    const p = pts.get(e.pointerId);
    if (!p) return;
    const prevX = p.x, prevY = p.y;
    p.x = e.clientX; p.y = e.clientY;

    if (pts.size === 1) {
      // --- drag to pan ---
      const c = cropSize(zoom);
      if (c.w > 0) {
        center.x -= (p.x - prevX) * c.w / cw;
        center.y -= (p.y - prevY) * c.h / ch;
        clampCenter();
      }
    } else if (pts.size >= 2) {
      // --- pinch to zoom (and pan with the midpoint) ---
      const [a, b] = [...pts.values()];
      const dist = Math.hypot(a.x - b.x, a.y - b.y);
      const mid  = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };

      if (lastPinchDist > 0 && lastMid) {
        const c = cropSize(zoom);
        if (c.w > 0) {
          center.x -= (mid.x - lastMid.x) * c.w / cw;
          center.y -= (mid.y - lastMid.y) * c.h / ch;
          clampCenter();
        }
        setZoom(zoom * (dist / lastPinchDist), mid);
      }
      lastPinchDist = dist;
      lastMid = mid;
    }
  });

  function endPointer(e) {
    pts.delete(e.pointerId);
    if (pts.size < 2) { lastPinchDist = 0; lastMid = null; }
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);
  canvas.addEventListener('pointerleave', endPointer);

  // double tap / double click → toggle 1× ↔ 3×
  canvas.addEventListener('pointerup', (e) => {
    const now = performance.now();
    if (now - lastTap < 300 && pts.size === 0) {
      if (zoom > 1.2) { setZoom(1); toast('Reset to 1×'); }
      else            { setZoom(3, { x: e.clientX, y: e.clientY }); }
    }
    lastTap = now;
  });

  // mouse wheel zoom (desktop)
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const factor = Math.exp(-e.deltaY * 0.0016);
    setZoom(zoom * factor, { x: e.clientX, y: e.clientY });
  }, { passive: false });

  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  // ---------- slider ----------
  slider.addEventListener('input', () => {
    setZoom(parseFloat(slider.value), null);
  });

  // ---------- camera ----------
  function showError(title, detail) {
    errTitle.textContent = title;
    errDetail.textContent = detail || '';
    errorEl.dataset.show = '1';
  }
  function hideError() { delete errorEl.dataset.show; }

  function stopCamera() {
    if (stream) {
      stream.getTracks().forEach(t => { try { t.stop(); } catch(_){} });
      stream = null;
    }
  }

  async function startCamera(face) {
    hideError();

    if (!window.isSecureContext) {
      showError('HTTPS required',
        'Camera access only works on https:// pages or on localhost.');
      return;
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showError('Camera not supported', 'This browser does not expose getUserMedia.');
      return;
    }

    stopCamera();

    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: {
          facingMode: { ideal: face },
          width:  { ideal: 1920 },
          height: { ideal: 1080 }
        }
      });
    } catch (err) {
      // fall back to any camera if the requested one is unavailable
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
      } catch (err2) {
        showError('Camera unavailable', (err2 && err2.message) || String(err2));
        return;
      }
    }

    video.srcObject = stream;
    try { await video.play(); } catch (_) {}

    // flashlight support
    torchOn = false;
    torchBtn.classList.remove('active');
    const track = stream.getVideoTracks()[0];
    const caps = (track && track.getCapabilities) ? track.getCapabilities() : {};
    torchBtn.style.display = caps.torch ? 'grid' : 'none';
  }

  // ---------- buttons ----------
  flipBtn.addEventListener('click', () => {
    facing = (facing === 'environment') ? 'user' : 'environment';
    startCamera(facing);
    toast(facing === 'user' ? 'Front camera' : 'Rear camera');
  });

  torchBtn.addEventListener('click', async () => {
    const track = stream && stream.getVideoTracks()[0];
    if (!track) return;
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    if (!caps.torch) { toast('No flashlight on this camera'); return; }
    torchOn = !torchOn;
    try {
      await track.applyConstraints({ advanced: [{ torch: torchOn }] });
      torchBtn.classList.toggle('active', torchOn);
    } catch (err) {
      torchOn = false;
      torchBtn.classList.remove('active');
      toast('Flashlight not available');
    }
  });

  snapBtn.addEventListener('click', () => {
    canvas.toBlob((blob) => {
      if (!blob) return;
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'magnifier-' + new Date().toISOString().replace(/[:.]/g, '-') + '.png';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1500);
      toast('Saved capture');
    }, 'image/png');
  });

  fullBtn.addEventListener('click', async () => {
    try {
      if (!document.fullscreenElement) {
        await (document.documentElement.requestFullscreen ||
               document.documentElement.webkitRequestFullscreen).call(document.documentElement);
      } else {
        await document.exitFullscreen();
      }
    } catch (_) { toast('Fullscreen blocked'); }
  });

  retryBtn.addEventListener('click', () => startCamera(facing));

  // ---------- boot ----------
  video.addEventListener('loadedmetadata', () => {
    center.x = video.videoWidth / 2;
    center.y = video.videoHeight / 2;
    computeBase();
    clampCenter();
    updateZoomUI();
  });

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 250));
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) { resize(); }
  });

  resize();
  updateZoomUI();
  requestAnimationFrame(render);
  startCamera(facing);

  setTimeout(() => {
    hintEl.textContent = 'Pinch or slide to zoom · drag to pan · double-tap to reset';
    hintEl.classList.add('show');
    setTimeout(() => hintEl.classList.remove('show'), 4500);
  }, 700);
})();
</script>
</body>
</html>
